name: nwbd-skills

services:
  db:
    image: postgres:16-alpine
    container_name: nwbd-ai-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-skills}
      POSTGRES_USER: ${POSTGRES_USER:-skills}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请先在 deploy/.env 配置数据库口令}
      TZ: Asia/Shanghai
    volumes:
      - /opt/nwbd-skills/data/pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nwbd-skills-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  api:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        APT_MIRROR: ${APT_MIRROR:-deb.debian.org}
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.org/simple}
    image: nwbd-skills-api:latest
    container_name: nwbd-skills-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NWBD_SKILLS_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-skills}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-skills}
      NWBD_SKILLS_DATA_DIR: /app/data
    volumes:
      - /opt/nwbd-skills/data:/app/data
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nwbd-skills-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  web:
    image: nginx:1.27-alpine
    container_name: nwbd-skills-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "18138:80"
    volumes:
      - /opt/nwbd-skills/frontend/dist:/usr/share/nginx/html:ro
      - /opt/nwbd-skills/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - nwbd-skills-net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  nwbd-skills-net:
    name: nwbd-skills-net
